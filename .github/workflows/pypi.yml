name: PyPI

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  credentials:
    name: Verify PyPI credentials
    runs-on: ubuntu-latest
    env:
      MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Require PyPI publishing credentials
        run: |
          if [[ -z "$MATURIN_PYPI_TOKEN" ]]; then
            echo "Missing required release secret: PYPI_API_TOKEN" >&2
            exit 1
          fi

  linux-wheels:
    name: Linux wheel (${{ matrix.target }})
    needs: credentials
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --compatibility pypi --out dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-linux-${{ matrix.target }}
          path: dist

  macos-wheels:
    name: macOS wheel (${{ matrix.target }})
    needs: credentials
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    needs: credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build source distribution
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux-wheels, macos-wheels, sdist]
    env:
      MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: upload
          args: --non-interactive dist/*
