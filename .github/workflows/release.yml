name: Release

# Bootstrap the repo secrets this workflow needs once it is on GitHub:
#     clihatch secrets rvben/cacheferret        # use --dry-run to preview
#
# Each target publishes in its own job, so one target's failure (for example a
# registry rate limit) does not block the others. Re-run only the failed target
# with: gh run rerun <run-id> --failed

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip actual publishing)'
        required: false
        default: true
        type: boolean
      skip_crates_io:
        description: 'Skip publishing to crates.io (if already published)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Avoid the intermittent "HTTP2 framing layer" curl errors when cargo fetches
  # from crates.io on GitHub-hosted runners.
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  credentials:
    name: Verify release credentials
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Explain dry run
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run requested; registry credentials are not required"
      - name: Require every publishing credential
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          missing=()
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || missing+=(CARGO_REGISTRY_TOKEN)
          [[ -n "$HOMEBREW_TAP_DEPLOY_KEY" ]] || missing+=(HOMEBREW_TAP_DEPLOY_KEY)
          [[ -n "$PYPI_API_TOKEN" ]] || missing+=(PYPI_API_TOKEN)
          if (( ${#missing[@]} )); then
            printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  test:
    name: Run release gate
    needs: credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.86.7
        with:
          tool: nextest
      - name: Verify Cargo.lock is up to date
        run: cargo check --locked
      - name: Verify tag matches Cargo version
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Run strict linting
        run: make lint
      - name: Run tests
        run: make test
      - name: Run Linux end-to-end safety tests
        run: make test-linux-e2e
      - name: Verify packaging assets
        run: make packaging-check
      - name: Verify publishable package
        run: cargo package --locked

  release-assets:
    name: Generate release support files
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate shell completions
        run: |
          cargo build --release --locked
          mkdir -p support/completions
          ./target/release/cacheferret completions bash > support/completions/cacheferret.bash
          ./target/release/cacheferret completions zsh > support/completions/_cacheferret
          ./target/release/cacheferret completions fish > support/completions/cacheferret.fish
          ./target/release/cacheferret completions powershell > support/completions/cacheferret.ps1
          ./target/release/cacheferret completions elvish > support/completions/cacheferret.elv
          cp README.md LICENSE CHANGELOG.md support/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: support-files
          path: support

  build:
    name: Build ${{ matrix.target }}
    needs: [test, release-assets]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled on Apple Silicon (Intel mac runners are scarce).
          - os: macos-14
            target: x86_64-apple-darwin
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify binary
        # Skip for cross-compiled targets the runner cannot execute.
        if: ${{ !matrix.cross }}
        run: ./target/${{ matrix.target }}/release/cacheferret --version

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p release-package
          cp "target/${{ matrix.target }}/release/cacheferret" release-package/cacheferret
      - uses: actions/download-artifact@v8.0.1
        with:
          name: support-files
          path: release-package
      - name: Pack and checksum release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="cacheferret-${VERSION}-${{ matrix.target }}"
          tar -czf "${ARCHIVE_NAME}.tar.gz" -C release-package cacheferret README.md LICENSE CHANGELOG.md completions
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi
          rm -rf release-package

      - name: Upload release archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            cacheferret-*-${{ matrix.target }}.tar.gz*

  # crates.io publishes independently: a failure here does not block the other
  # targets, and `gh run rerun --failed` retries only this job.
  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        if: ${{ inputs.dry_run != true && inputs.skip_crates_io != true }}
        run: cargo publish --locked

      - name: Test crates.io publish (dry run)
        if: ${{ inputs.dry_run == true && inputs.skip_crates_io != true }}
        run: cargo publish --dry-run --locked

      - name: Skip crates.io publishing
        if: ${{ inputs.skip_crates_io == true }}
        run: echo "Skipping crates.io publishing as requested"

  github-release:
    name: Create GitHub release
    needs: build
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            artifacts/release-*/cacheferret-*.tar.gz
            artifacts/release-*/cacheferret-*.tar.gz.sha256

  update-homebrew:
    name: Update Homebrew tap
    needs: github-release
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: /tmp/artifacts

      - name: Compute SHA256 hashes
        id: hashes
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            sha=$(cat /tmp/artifacts/release-${target}/cacheferret-${{ github.ref_name }}-${target}.tar.gz.sha256 | awk '{print $1}')
            key=$(echo "${target}" | tr '-' '_')
            echo "${key}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Trust GitHub's SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Update Homebrew formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          scripts/render-homebrew-formula.sh \
            packaging/homebrew/cacheferret.rb.in \
            /tmp/cacheferret.rb \
            "$VERSION" \
            "$VERSION_NUM" \
            "${{ steps.hashes.outputs.aarch64_apple_darwin }}" \
            "${{ steps.hashes.outputs.x86_64_apple_darwin }}" \
            "${{ steps.hashes.outputs.aarch64_unknown_linux_gnu }}" \
            "${{ steps.hashes.outputs.x86_64_unknown_linux_gnu }}"
          ruby -c /tmp/cacheferret.rb

          git clone git@github.com:rvben/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/cacheferret.rb /tmp/tap/Formula/cacheferret.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cacheferret.rb
          git diff --cached --quiet || git commit -m "chore(homebrew): update cacheferret to ${VERSION}"
          git push
