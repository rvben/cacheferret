[package]
name = "cacheferret"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Find and safely clean developer caches across macOS and Linux"
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/rvben/cacheferret"
homepage = "https://github.com/rvben/cacheferret"
keywords = ["cache", "cleanup", "developer-tools", "disk-space", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
name = "cacheferret"
path = "src/lib.rs"

[[bin]]
name = "cacheferret"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
